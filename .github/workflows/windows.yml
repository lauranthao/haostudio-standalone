# HAo Studio — Windows build (GitHub Actions).
#
# ADD THIS FILE VIA THE GITHUB WEB UI ONLY — do NOT git push it.
# The repo's PAT has no `workflow` scope, so a pushed .github/workflows/
# file is rejected; the parent adds this file at
# github.com/lauranthao/haostudio-standalone → Actions → New workflow →
# paste. Path once added: .github/workflows/windows.yml
#
# Trigger: every push to feature/windows-port, or manually from the
# Actions tab (Run workflow). The parent triggers the first package
# build from the Actions tab after adding the file.
#
# What it does (no tests here — the Dart tests run on the Linux VM,
# where several widget tests hang; see the audit):
#   1. windows-latest runner, Flutter 3.47.0 (the version the app
#      builds with — keep in sync with the repo's Flutter version).
#   2. flutter pub get + flutter analyze (0 issues required).
#   3. flutter build windows --release
#      → build/windows/x64/runner/Release/standalone.exe (+ data/).
#   4. Zip the Release folder → HAoStudio-standalone-v1.1.5-windows.zip
#      (the URL version-windows.json points at:
#      https://chen-hao-shop-production.up.railway.app/HAoStudio-standalone-v1.1.5-windows.zip).
#   5. Inno Setup (choco install innosetup) compiles
#      windows/installer.iss → HAoStudio-standalone-v1.1.5-setup.exe
#      (per-user install, no admin/UAC).
#   6. Uploads both as artifacts (zip + setup exe, 90 days).
#
# After the first green build, the release step (done by the parent,
# not CI): download the zip, note its byte size, upload it to the shop
# public/ (Railway deploy), then update version-windows.json in all
# three places (repo root, shop public/, Gitee repo root) with the
# real exeSize + exeBuild, and bump the changelog. The manifest
# currently says exeBuild 24 (= the bundled build) so no update is
# offered before the first package exists.
#
# Version note: the 1.1.5 in the artifact names is hardcoded here and
# in windows/installer.iss — when the app version bumps, update all
# three (this file, installer.iss, version-windows.json) together.

name: Windows build

on:
  push:
    branches: [feature/windows-port]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: "stable"
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter build windows --release
        run: flutter build windows --release

      - name: Zip the Release folder
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath HAoStudio-standalone-v1.1.5-windows.zip
          Get-Item HAoStudio-standalone-v1.1.5-windows.zip |
            Select-Object Name, Length

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build the installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows/installer.iss
          Get-Item build/windows-installer/HAoStudio-standalone-v1.1.5-setup.exe |
            Select-Object Name, Length

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: HAoStudio-standalone-v1.1.5-windows-zip
          path: HAoStudio-standalone-v1.1.5-windows.zip
          retention-days: 90

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: HAoStudio-standalone-v1.1.5-windows-setup
          path: build/windows-installer/HAoStudio-standalone-v1.1.5-setup.exe
          retention-days: 90
