name: Windows screenshots

on:
  workflow_dispatch:

jobs:
  shots:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: "stable"
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build windows --release
        run: flutter build windows --release

      - name: Run the app and screenshot each tab
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public class Win {
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int X, int Y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint dwFlags, uint dx, uint dy, uint dwData, UIntPtr dwExtraInfo);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT lpRect);
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
            public static void Click(int x, int y) {
              SetCursorPos(x, y);
              mouse_event(0x0002, 0, 0, 0, UIntPtr.Zero);
              mouse_event(0x0004, 0, 0, 0, UIntPtr.Zero);
            }
          }
          "@
          function Save-Shot($name) {
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bmp.Save($name, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
            Get-Item $name | Select-Object Name, Length
          }
          $proc = Start-Process build/windows/x64/runner/Release/standalone.exe -PassThru
          Start-Sleep -Seconds 20
          for ($i = 0; $i -lt 10 -and $proc.MainWindowHandle -eq 0; $i++) { Start-Sleep -Seconds 2; $proc.Refresh() }
          $rect = New-Object Win+RECT
          [Win]::GetWindowRect($proc.MainWindowHandle, [ref]$rect) | Out-Null
          [Win]::SetForegroundWindow($proc.MainWindowHandle) | Out-Null
          $left = $rect.Left; $top = $rect.Top
          Save-Shot "shot-home.png"
          [Win]::Click(($left + 38), ($top + 250))
          Start-Sleep -Seconds 8
          Save-Shot "shot-music.png"
          [Win]::Click(($left + 38), ($top + 181))
          Start-Sleep -Seconds 10
          Save-Shot "shot-live.png"
          [Win]::Click(($left + 38), ($top + 320))
          Start-Sleep -Seconds 5
          Save-Shot "shot-settings.png"
          Stop-Process -Name standalone -ErrorAction SilentlyContinue

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: windows-screenshots
          path: shot-*.png
          retention-days: 90
