name: Windows screenshots

on:
  workflow_dispatch:

jobs:
  shots:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: "stable"
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build windows --release
        run: flutter build windows --release

      - name: Run the app and screenshot the home page
        shell: pwsh
        run: |
          Start-Process build/windows/x64/runner/Release/standalone.exe
          Start-Sleep -Seconds 25
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bmp.Save("shot-home.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Get-Item shot-home.png | Select-Object Name, Length
          Stop-Process -Name standalone -ErrorAction SilentlyContinue

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: windows-screenshots
          path: shot-home.png
          retention-days: 90
