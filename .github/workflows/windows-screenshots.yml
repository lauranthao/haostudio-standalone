name: Windows screenshots

on:
  workflow_dispatch:

jobs:
  shots:
    runs-on: windows-latest
    steps:
      - name: Download the built Windows package
        uses: actions/download-artifact@v4
        with:
          name: HAoStudio-standalone-v1.1.5-windows-zip
          run-id: 44743654478
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: pkg

      - name: Run the app and screenshot the home page
        shell: pwsh
        run: |
          Expand-Archive -Path pkg/HAoStudio-standalone-v1.1.5-windows.zip -DestinationPath app
          Start-Process app/standalone.exe
          Start-Sleep -Seconds 25
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bmp.Save("shot-home.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Get-Item shot-home.png | Select-Object Name, Length
          Stop-Process -Name standalone -ErrorAction SilentlyContinue

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: windows-screenshots
          path: shot-home.png
          retention-days: 90
