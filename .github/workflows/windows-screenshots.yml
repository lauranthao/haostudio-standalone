name: Windows screenshots

on:
  workflow_dispatch:

jobs:
  shots:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: "stable"
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build windows --release
        run: flutter build windows --release

      - name: Run the app and screenshot each tab
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public class Mouse {
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int X, int Y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint dwFlags, uint dx, uint dy, uint dwData, UIntPtr dwExtraInfo);
            public static void Click(int x, int y) {
              SetCursorPos(x, y);
              mouse_event(0x0002, 0, 0, 0, UIntPtr.Zero);
              mouse_event(0x0004, 0, 0, 0, UIntPtr.Zero);
            }
          }
          "@
          function Save-Shot($name) {
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bmp.Save($name, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
            Get-Item $name | Select-Object Name, Length
          }
          Start-Process build/windows/x64/runner/Release/standalone.exe
          Start-Sleep -Seconds 20
          [Mouse]::Click(500, 15)
          Start-Sleep -Seconds 2
          Save-Shot "shot-home.png"
          [Mouse]::Click(38, 250)
          Start-Sleep -Seconds 8
          Save-Shot "shot-music.png"
          [Mouse]::Click(38, 181)
          Start-Sleep -Seconds 10
          Save-Shot "shot-live.png"
          [Mouse]::Click(38, 320)
          Start-Sleep -Seconds 5
          Save-Shot "shot-settings.png"
          Stop-Process -Name standalone -ErrorAction SilentlyContinue

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: windows-screenshots
          path: shot-*.png
          retention-days: 90
