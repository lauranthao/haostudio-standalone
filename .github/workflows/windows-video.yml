name: Windows video

on:
  workflow_dispatch:

jobs:
  video:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: "stable"
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build windows --release
        run: flutter build windows --release

      - name: Record the app
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y }
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public class Win {
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int X, int Y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint dwFlags, uint dx, uint dy, uint dwData, UIntPtr dwExtraInfo);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT lpRect);
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
            public static void Click(int x, int y) {
              SetCursorPos(x, y);
              mouse_event(0x0002, 0, 0, 0, UIntPtr.Zero);
              mouse_event(0x0004, 0, 0, 0, UIntPtr.Zero);
            }
          }
          "@
          $ffmpeg = Start-Process ffmpeg -ArgumentList '-f gdigrab -framerate 15 -t 75 -i desktop -c:v libx264 -pix_fmt yuv420p -y video.mp4' -PassThru -NoNewWindow
          $proc = Start-Process .\build\windows\x64\runner\Release\standalone.exe -PassThru
          Start-Sleep -Seconds 20
          for ($i = 0; $i -lt 10 -and $proc.MainWindowHandle -eq 0; $i++) { Start-Sleep -Seconds 2; $proc.Refresh() }
          $rect = New-Object Win+RECT
          [Win]::GetWindowRect($proc.MainWindowHandle, [ref]$rect) | Out-Null
          [Win]::SetForegroundWindow($proc.MainWindowHandle) | Out-Null
          $left = $rect.Left; $top = $rect.Top
          [Win]::Click(($left + 56), ($top + 442))
          Start-Sleep -Seconds 8
          [Win]::Click(($left + 56), ($top + 371))
          Start-Sleep -Seconds 10
          [Win]::Click(($left + 56), ($top + 512))
          Start-Sleep -Seconds 8
          [Win]::Click(($left + 56), ($top + 299))
          Start-Sleep -Seconds 5
          Wait-Process -Id $ffmpeg.Id
          Stop-Process -Name standalone -ErrorAction SilentlyContinue
          Get-Item video.mp4 | Select-Object Name, Length

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: windows-video
          path: video.mp4
