<script>
  function toggleMenu(){ document.getElementById('sideMenu').classList.toggle('open'); document.getElementById('menuOverlay').classList.toggle('show'); syncMenu(); }
  function closeMenu(){ var m=document.getElementById('sideMenu'); if(m) m.classList.remove('open'); var o=document.getElementById('menuOverlay'); if(o) o.classList.remove('show'); }
  function syncMenu(){ if(typeof syncNav==='function') syncNav(); var seg=document.querySelectorAll('#menuModeSeg .mode-seg-btn'); for(var i=0;i<seg.length;i++){ seg[i].classList.toggle('on', typeof mode!=='undefined'&&seg[i].getAttribute('data-mode')===mode); } var l=typeof lang!=='undefined'?lang:'zh-CN'; var c=document.getElementById('langCN'), w=document.getElementById('langTW'), e=document.getElementById('langEN'); if(c) c.classList.toggle('on',l==='zh-CN'); if(w) w.classList.toggle('on',l==='zh-TW'); if(e) e.classList.toggle('on',l==='en'); }
  document.addEventListener('DOMContentLoaded', syncMenu);
</script>
