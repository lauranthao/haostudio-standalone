# HAo Studio 独立版 Flutter 1.0.4 — Codemagic 工作流（草稿，未验证、未推送）
#
# Flutter 版本就是 v1.0.4（version 1.0.4+5）。Swift+web v1.0.4 已取消，不再构建。
# 本文件放在 Flutter 工程根目录 ~/workspace/deploy/standalone-app-flutter/codemagic.yaml。
# 仓库：与 Swift 版共用 GitHub lauranthao/haostudio-standalone 仍待定（勿擅自推送），
# 本工作流名 ios-flutter-unsigned，与现有的 ios-unsigned（Swift）工作流并存，互不干扰。
# 注意：Codemagic 上需新建或复用应用并选择 ios-flutter-unsigned 工作流；本文件只是草稿，
# 首次构建前须在 Codemagic 网页端核对 flutter/xcode 版本与产物路径。
workflows:
  ios-flutter-unsigned:
    name: iOS Flutter Unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: 3.47.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build iOS unsigned
        script: |
          flutter build ios --release --no-codesign
      - name: Package IPA
        script: |
          APP_PATH=$(find build/ios/iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP_PATH"
          rm -rf Payload HAoStudio.ipa
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r HAoStudio.ipa Payload
          ls -lh HAoStudio.ipa
    artifacts:
      - HAoStudio.ipa
  ios-flutter-simulator:
    name: iOS Simulator App (Appetize)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: 3.47.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Build iOS simulator app
        script: |
          flutter build ios --simulator --no-codesign
          ls -lh build/ios/iphonesimulator/Runner.app
      - name: Zip simulator app for Appetize
        script: |
          cd build/ios/iphonesimulator
          zip -r HAoStudio-simulator.zip Runner.app
          ls -lh HAoStudio-simulator.zip
    artifacts:
      - build/ios/iphonesimulator/HAoStudio-simulator.zip
  # Android APK (v1.1.2+13, android-apk branch) — first Android build.
  # Fat release APK (all ABIs incl. x86_64 for the Appetize emulator;
  # NEVER add --split-per-abi, see B8). Signing: the release keystore
  # (PKCS12) is restored at build time from the Codemagic-encrypted
  # environment variable ANDROID_KEYSTORE_BASE64; passwords/alias come
  # from ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS /
  # ANDROID_KEY_PASSWORD. Only variable NAMES appear here — never
  # values. Set all four in Codemagic (web UI) before the first build.
  android-apk:
    name: Android APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: 3.47.0
      java: 17
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Ensure NDK 28.2.13676358 (Flutter 3.47 default)
        script: |
          if [ ! -d "$ANDROID_HOME/ndk/28.2.13676358" ]; then
            echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          fi
          ls "$ANDROID_HOME/ndk"
      - name: Restore release keystore
        script: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set in Codemagic environment variables"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > $CM_BUILD_DIR/android/keystore.p12
          cat > $CM_BUILD_DIR/android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../keystore.p12
          EOF
          ls -l $CM_BUILD_DIR/android/keystore.p12
      - name: Build release APK
        script: |
          flutter build apk --release
          ls -lh build/app/outputs/flutter-apk/app-release.apk
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
