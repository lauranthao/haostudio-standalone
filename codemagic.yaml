# HAo Studio 独立版 — Codemagic 工作流。
#
# android-apk 工作流是现役的（android-apk 分支，Flutter 3.47.0）：每次发版出
# 3 个 per-ABI APK。下面的 ios-flutter-unsigned / ios-flutter-simulator
# 是 1.0.4 时期的旧草稿，未验证、未推送；iOS 发版走 Codemagic 网页端的应用
# 配置，不走这里的两个 iOS 工作流。
workflows:
  ios-flutter-unsigned:
    name: iOS Flutter Unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: 3.47.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build iOS unsigned
        script: |
          flutter build ios --release --no-codesign
      - name: Package IPA
        script: |
          APP_PATH=$(find build/ios/iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP_PATH"
          rm -rf Payload HAoStudio.ipa
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r HAoStudio.ipa Payload
          ls -lh HAoStudio.ipa
    artifacts:
      - HAoStudio.ipa
  ios-flutter-simulator:
    name: iOS Simulator App (Appetize)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: 3.47.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Build iOS simulator app
        script: |
          flutter build ios --simulator --no-codesign
          ls -lh build/ios/iphonesimulator/Runner.app
      - name: Zip simulator app for Appetize
        script: |
          cd build/ios/iphonesimulator
          zip -r HAoStudio-simulator.zip Runner.app
          ls -lh HAoStudio-simulator.zip
    artifacts:
      - build/ios/iphonesimulator/HAoStudio-simulator.zip
  # Android APK (android-apk branch) — per-ABI release APKs (P1-A1).
  # --split-per-abi builds one APK per ABI (arm64-v8a ~66MB,
  # armeabi-v7a ~52MB, x86_64 ~68MB) instead of the 179MB fat APK;
  # the in-app updater downloads the one matching the device ABI
  # (AndroidAbi via DeviceInfoPlugin) and falls back to the fat apkUrl
  # when a per-ABI URL is missing from version.json. x86_64 stays:
  # chen's Android emulator runs on it (the old B8 rule "NEVER add
  # --split-per-abi" is superseded — the updater now selects by ABI
  # instead of serving one file to every device).
  # Signing: the release keystore (PKCS12) is restored at build time
  # from the Codemagic-encrypted environment variable
  # ANDROID_KEYSTORE_BASE64; passwords/alias come from
  # ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS /
  # ANDROID_KEY_PASSWORD. Only variable NAMES appear here — never
  # values. Set all four in Codemagic (web UI) before the first build.
  android-apk:
    name: Android APK
    max_build_duration: 60
    # 免费套餐没有 Linux 实例（linux_x2 两次构建都在分配阶段直接失败），
    # 用 iOS 工作流同款免费实例 mac_mini_m1；Android 构建在 macOS 实例上一样跑
    #（Android SDK、sdkmanager 都预装）。
    instance_type: mac_mini_m1
    environment:
      flutter: 3.47.0
      java: 17
      groups:
        - haostudio
      android_signing:
        - haostudio
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Ensure NDK 28.2.13676358 (Flutter 3.47 default)
        script: |
          if [ ! -d "$ANDROID_HOME/ndk/28.2.13676358" ]; then
            echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          fi
          ls "$ANDROID_HOME/ndk"
      - name: Write release key.properties from Codemagic code signing
        script: |
          if [ -z "$CM_KEYSTORE_PATH" ]; then
            echo "CM_KEYSTORE_PATH is not set — upload the release keystore in Codemagic code signing settings"
            exit 1
          fi
          cat > $CM_BUILD_DIR/android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
          ls -l "$CM_KEYSTORE_PATH"
      - name: Build release APKs (per ABI)
        script: |
          flutter build apk --release --split-per-abi
          ls -lh build/app/outputs/flutter-apk/
    artifacts:
      - build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
      - build/app/outputs/flutter-apk/app-x86_64-release.apk
