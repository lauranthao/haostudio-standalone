name: standalone
description: "HAo Studio standalone app — music, live and video. Flutter 1.0.4."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.1.2+13

environment:
  sdk: ^3.13.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Liquid glass (iOS 26/27 shader glass) for floating chrome: mini
  # player, dialogs, sheets, switches. Zero third-party deps of its
  # own. Our 4-theme system stays authoritative — see
  # lib/core/theme/liquid_glass_theme.dart for the mapping.
  liquid_glass_widgets: ^1.17.5

  # --- Player kernels (Pure Live 3.x, inventory §4.1) ---
  # media_kit / media_kit_video come from the Predidit fork, NOT pub.dev:
  # the fork carries Pure Live patches (see media_kit_video/PURELIVE_PATCH.md).
  # Pin: ref 83b7ca63772856e1ea0158916177e136f7b7b0be.
  media_kit:
    git:
      url: https://github.com/Predidit/media-kit.git
      ref: 83b7ca63772856e1ea0158916177e136f7b7b0be
      path: ./media_kit
  media_kit_video:
    git:
      url: https://github.com/Predidit/media-kit.git
      ref: 83b7ca63772856e1ea0158916177e136f7b7b0be
      path: ./media_kit_video
  # IJK engine: flv_lzc is a git-only fork of fijkplayer (no pub.dev package).
  # Lockfile version 1.0.4+purelive.2, ref from media_core_ijk_player.
  flv_lzc:
    git:
      url: https://github.com/liuchuancong/flv_lzc.git
      ref: 162030d642857109048a8e6858d502b8d73c754a
  # AVPlayer engine on iOS (BetterPlayer underneath). Pure Live lockfile: 1.4.1.
  better_player_plus: 1.4.1

  # Screen brightness for the VOD player's left-half vertical drag —
  # the same packages Pure Live uses (platform interface + iOS impl).
  screen_brightness_platform_interface: ^2.1.2
  screen_brightness_android: ^2.1.6
  screen_brightness_ios: ^2.1.4

  # --- Networking / storage / state (Pure Live stack: GetX + Hive + Dio) ---
  dio: 5.11.1
  # MD5 signing for the Huya anti-code (buildAntiCode) + SHA-256 URL keys
  # for per-URL lease bookkeeping.
  crypto: ^3.0.8
  hive_ce: 2.20.2
  hive_ce_flutter: ^2.4.0
  path_provider: ^2.1.5
  web_socket_channel: 3.0.3

  # --- Danmaku ---
  flame_barrage: 0.0.9
  protobuf: 6.1.0
  # Danmaku transports (ported from Pure Live 3.x):
  # - crypto: Douyin X-Bogus signing (md5), Kuaishou feed dedupe (sha1).
  #   (crypto is already declared above at ^3.0.8 — do not re-declare.)
  # - brotli: Bilibili danmaku protover-3 compressed frames.
  # - fixnum: Douyin generated protobuf (Int64 fields).
  brotli: ^0.6.0
  fixnum: ^1.1.1

  # --- State management ---
  # NOTE (inventory §4.3): Pure Live vendors a GetX fork in lib/get/ and has
  # NO `get` pub dep. For v1.0.4 we use pub.dev `get` and record the
  # fork-diff as an OPEN QUESTION: diff lib/get/ against get 4.7.x for Pure
  # Live patches before relying on any GetX behaviour the fork changed.
  get: ^4.7.2
  file_picker: ^13.3.3
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  flutter_js: ^0.8.7
  # Equalizer (stage 3): vendored just_audio fork with the
  # MTAudioProcessingTap EQ engine in the darwin layer — see
  # packages/just_audio_eq/HAO_PATCH.md. Dart API is identical to
  # just_audio 0.10.6; do NOT switch back to the hosted version or
  # the EQ hook is lost.
  just_audio:
    path: packages/just_audio_eq

  # Audio-session config for the "与其他音频同时播放" setting
  # (Beans PlayerManager.applyAudioMixPreference): category playback +
  # mixWithOthers. Direct dep (not transitive via just_audio) because
  # lib/ imports it; just_audio only activates the session, it never
  # re-configures the category, so our configure() call is not clobbered.
  audio_session: ^0.2.4

  # Screen-on during live / VOD playback — owned by PlaybackSession
  # (see playback_session.dart). Declared here (not just in the
  # override below) because lib/ imports it directly; the platform
  # interface is imported by test/playback_wakelock_test.dart's fake.
  wakelock_plus: ^1.7.0
  wakelock_plus_platform_interface: ^1.7.0

# The Predidit media_kit_video fork pins wakelock_plus 1.3.3 exactly, while
# better_player_plus 1.4.1 needs wakelock_plus ^1.7.0. Pure Live resolves
# this same clash with a dependency override to ^1.7.0 (its pubspec
# dependency_overrides); wakelock_plus's enable/disable API is stable
# across these versions, so the override is safe.
dependency_overrides:
  wakelock_plus: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # LX 歌一刀 script engine (M-P0-6): the four bundled music-source
  # scripts. Each runs in its own JS runtime; see
  # lib/services/music/lx_script_engine.dart. The 溯音 script's embedded
  # shared key was sanitised to '' before packaging — no key material
  # ships in these assets.
  assets:
    - assets/lx_scripts/
    - assets/logo.png
    - assets/logos/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
